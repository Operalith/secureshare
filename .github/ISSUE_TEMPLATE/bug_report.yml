name: Bug report
description: Report a reproducible SecureShare problem without including sensitive data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never include passwords, API keys, raw SecureShare links, SMTP credentials, Vault tokens, secret payloads, or other sensitive data.** Use private vulnerability reporting for security concerns.
  - type: input
    id: version
    attributes:
      label: SecureShare version
      description: Use `/version`, the System Status page, or the release tag.
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment method
      options:
        - Docker Compose
        - Source build
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use sanitized fixtures only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Redact logs before pasting them.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive-data check
      options:
        - label: I removed credentials, raw links, tokens, payloads, private domains, and private IP addresses.
          required: true
