name: Feature request
description: Propose a focused improvement to SecureShare.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, raw SecureShare links, secret payloads, private domains, or security vulnerability details.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or security need is not currently addressed?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: security
    attributes:
      label: Security and compatibility impact
      description: Describe effects on tokens, encryption, authorization, logging, deployment, or APIs.
